version: "3.8"

services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-22.04
    volumes:
      - ..:/workspaces/Healthcare-IoT-Testbed:cached
    command: sleep infinity
    # dumpcap (Wireshark) needs these; file caps on /usr/bin/dumpcap fail exec
    # with "Operation not permitted" if NET_ADMIN is missing from CapBnd.
    cap_add:
      - NET_ADMIN
      - NET_RAW
