name: Deploy Web to S3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Platform/services/web/**'
      - 'Platform/scripts/deploy_web.sh'
      - '.github/workflows/deploy-web.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_USE_LOCKFILE: ${{ vars.TF_USE_LOCKFILE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Platform/services/web/package-lock.json

      - name: Terraform Init
        run: Platform/scripts/tf_init.sh

      # Builds with the Terraform outputs (Cognito, API URL, brand), syncs to
      # S3 (long cache for assets, no-cache for HTML) and invalidates CloudFront.
      - name: Build and publish
        run: Platform/scripts/deploy_web.sh
