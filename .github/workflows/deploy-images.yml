name: Deploy Platform Images

# Builds the platform images (analysis-base and platform-ghidra, which carry
# the launcher and SDK), pushes them to ECR, and records them as new ready
# versions of the platform environments. Also builds the notebook layer
# (JupyterLab, copied into notebook sessions) and records it. The steps are
# in Platform/scripts/build_images.sh, shared with local deploys (deploy.sh).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Platform/services/containers/base/**"
      - "Platform/services/containers/ghidra/**"
      - "Platform/services/containers/launcher/**"
      - "Platform/services/containers/sdk/**"
      - "Platform/services/containers/notebook/**"
      - "Platform/scripts/seed_platform_envs.py"
      - "Platform/scripts/build_images.sh"
      - ".github/workflows/deploy-images.yml"

permissions:
  id-token: write
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_USE_LOCKFILE: ${{ vars.TF_USE_LOCKFILE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install boto3
        run: pip install --quiet boto3

      - name: Terraform Init
        run: Platform/scripts/tf_init.sh

      - name: Build, push and record the images
        run: Platform/scripts/build_images.sh
