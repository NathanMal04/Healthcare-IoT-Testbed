name: Frontend PR Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "Platform/services/web/**"
      - ".github/workflows/frontend-pr-check.yml"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Read Terraform outputs
        id: tf
        working-directory: Platform/infra/envs/dev
        run: |
          terraform init -input=false
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(terraform output -raw cognito_user_pool_client_id)" >> "$GITHUB_OUTPUT"
          echo "api_invoke_url=$(terraform output -raw api_invoke_url)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Platform/services/web/package-lock.json

      - name: Install dependencies
        working-directory: Platform/services/web
        run: npm ci

      - name: Build
        working-directory: Platform/services/web
        env:
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ steps.tf.outputs.cognito_user_pool_id }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ steps.tf.outputs.cognito_client_id }}
          NEXT_PUBLIC_API_URL: ${{ steps.tf.outputs.api_invoke_url }}
        run: npm run build
