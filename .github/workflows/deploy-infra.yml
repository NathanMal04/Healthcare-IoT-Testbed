name: Deploy Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Platform/infra/**"
      - "Platform/scripts/tf_init.sh"
      - ".github/workflows/deploy-infra.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The deployment's settings: secrets AWS_ROLE_ARN and AWS_REGION, and the
    # repository variables below (SELF_HOSTING.md, "GitHub Actions").
    env:
      TF_VAR_aws_profile: ""
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_USE_LOCKFILE: ${{ vars.TF_USE_LOCKFILE }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_name: ${{ vars.TF_NAME }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}
      TF_VAR_brand_name: ${{ vars.BRAND_NAME }}
    defaults:
      run:
        working-directory: Platform/infra/envs/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository variables
        run: |
          missing=""
          [ -n "$TF_STATE_BUCKET" ] || missing="$missing TF_STATE_BUCKET"
          [ -n "$TF_VAR_name" ] || missing="$missing TF_NAME"
          [ -n "$TF_VAR_domain_name" ] || missing="$missing DOMAIN_NAME"
          if [ -n "$missing" ]; then
            echo "::error::Set these repository variables (Settings > Secrets and variables > Actions > Variables):$missing"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: "$GITHUB_WORKSPACE/Platform/scripts/tf_init.sh -upgrade"

      - name: Terraform Plan
        run: terraform plan -var 'aws_profile=' -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
